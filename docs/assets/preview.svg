<svg xmlns="http://www.w3.org/2000/svg" width="860" height="780" viewBox="0 0 860 780" role="img" aria-label="Roll Dice UI preview">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#673AB7"/><stop offset="1" stop-color="#311B92"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6CE7E"/><stop offset="1" stop-color="#F5E100"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      .h{font:600 25px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#fff;text-anchor:middle}
      .btn{font:900 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#000;text-anchor:middle}
      .st{font:600 13px system-ui,sans-serif;fill:#fff}
      .cap{font:700 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#7E57C2;text-anchor:middle}
      .sub{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#8a8a99;text-anchor:middle}
      .arrow{font:700 40px system-ui,sans-serif;fill:#9575CD;text-anchor:middle}
      .note{font:500 13px system-ui,sans-serif;fill:#8a8a99;text-anchor:middle}
    </style>
  </defs>
  
  <g transform="translate(70 60)">
    <rect x="-10" y="-10" width="320" height="620" rx="46" fill="#14112a" stroke="#9575CD" stroke-opacity=".35" stroke-width="2"/>
    <rect width="300" height="600" rx="38" fill="url(#g)"/>
    <rect x="115" y="12" width="70" height="20" rx="10" fill="#14112a"/>
    <text x="22" y="28" class="st">9:41</text>
    <text x="150.0" y="196" class="h">Roll Dice App</text>
    <rect x="60" y="224" width="180" height="180" rx="22" fill="url(#face)" filter="url(#sh)"/><g fill="#1d1c17"><circle cx="202" cy="262" r="15"/><circle cx="98" cy="366" r="15"/></g>
    <text x="150.0" y="478" class="btn">Click to Roll</text>
    <text x="150.0" y="652" class="cap">On launch</text>
    <text x="150.0" y="674" class="sub">currentDice starts at 2</text>
  </g>
  <text x="430" y="380" class="arrow">→</text>
  <text x="430" y="410" class="note">tap</text>
  
  <g transform="translate(490 60)">
    <rect x="-10" y="-10" width="320" height="620" rx="46" fill="#14112a" stroke="#9575CD" stroke-opacity=".35" stroke-width="2"/>
    <rect width="300" height="600" rx="38" fill="url(#g)"/>
    <rect x="115" y="12" width="70" height="20" rx="10" fill="#14112a"/>
    <text x="22" y="28" class="st">9:41</text>
    <text x="150.0" y="196" class="h">Roll Dice App</text>
    <rect x="60" y="224" width="180" height="180" rx="22" fill="url(#face)" filter="url(#sh)"/><g fill="#1d1c17"><circle cx="98" cy="262" r="15"/><circle cx="202" cy="262" r="15"/><circle cx="150" cy="314" r="15"/><circle cx="98" cy="366" r="15"/><circle cx="202" cy="366" r="15"/></g>
    <text x="150.0" y="478" class="btn">Click to Roll</text>
    <text x="150.0" y="652" class="cap">After a tap</text>
    <text x="150.0" y="674" class="sub">Random().nextInt(6) + 1</text>
  </g>
  <text x="430" y="770" class="note">UI preview with sample data · layout mirrors lib/diceroll.dart · dice drawn to match assets/</text>
</svg>
