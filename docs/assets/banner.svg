<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Roll Dice — a Flutter dice roller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#673AB7"/>
      <stop offset="1" stop-color="#311B92"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6CE7E"/>
      <stop offset="1" stop-color="#F5E100"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12063d" flood-opacity="0.55"/>
    </filter>
    <style>
      .title{font:800 68px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .tag{font:500 24px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#E9E2FF}
      .tech{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#C9B8FF;letter-spacing:1px}
      .chip text{font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}
      .plat{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#B9A8F0}
      .fade{opacity:0;animation:fade .9s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s ease-in-out infinite}
      @keyframes spin{0%,70%{transform:rotate(-8deg)}80%{transform:rotate(352deg)}100%{transform:rotate(352deg)}}
      .drift{transform-box:fill-box;transform-origin:center;animation:drift 7s ease-in-out infinite alternate}
      @keyframes drift{from{transform:translate(0,0) rotate(12deg)}to{transform:translate(-14px,16px) rotate(24deg)}}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
      @media (prefers-reduced-motion: reduce){.spin,.drift,.tw,.fade{animation:none;opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#fff">
    <circle class="tw" cx="90" cy="60" r="2.5"/>
    <circle class="tw" cx="640" cy="44" r="2" style="animation-delay:.8s"/>
    <circle class="tw" cx="560" cy="380" r="2.5" style="animation-delay:1.4s"/>
    <circle class="tw" cx="1140" cy="380" r="2" style="animation-delay:.4s"/>
    <circle class="tw" cx="1150" cy="60" r="2.5" style="animation-delay:2s"/>
    <circle class="tw" cx="700" cy="300" r="1.8" style="animation-delay:1.1s"/>
  </g>

  <!-- text -->
  <g transform="translate(70 0)">
    <text class="title fade d1" x="0" y="150">Roll Dice</text>
    <text class="tag fade d2" x="0" y="196">Tap the button. Fate decides. A tiny, honest Flutter app.</text>
    <text class="tech fade d2" x="0" y="234">FLUTTER · DART · MATERIAL · STATEFULWIDGET</text>

    <g transform="translate(0 262)"><g class="chip fade d3">
      <rect width="148" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
      <text x="74" y="25" text-anchor="middle">🎲 Random 1–6</text>
    </g></g>
    <g transform="translate(160 262)"><g class="chip fade d3">
      <rect width="148" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
      <text x="74" y="25" text-anchor="middle">⚡ setState</text>
    </g></g>
    <g transform="translate(320 262)"><g class="chip fade d3">
      <rect width="148" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
      <text x="74" y="25" text-anchor="middle">🎨 Purple gradient</text>
    </g></g>
    <g transform="translate(480 262)"><g class="chip fade d3">
      <rect width="148" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
      <text x="74" y="25" text-anchor="middle">🚀 CI web build</text>
    </g></g>

    <text class="plat fade d4" x="0" y="350">Android · iOS · Web · Windows · macOS · Linux</text>
  </g>

  <!-- back die (drifting) -->
  <g class="drift" filter="url(#shadow)">
    <rect x="955" y="70" width="150" height="150" rx="26" fill="url(#face)" opacity=".85"/>
    <g fill="#1d1c17" opacity=".85">
      <circle cx="995" cy="110" r="13"/><circle cx="1065" cy="110" r="13"/>
      <circle cx="995" cy="180" r="13"/><circle cx="1065" cy="180" r="13"/>
    </g>
  </g>

  <!-- front die (rolling) -->
  <g class="spin" filter="url(#shadow)">
    <rect x="790" y="150" width="190" height="190" rx="32" fill="url(#face)"/>
    <g fill="#1d1c17">
      <circle cx="840" cy="200" r="17"/><circle cx="930" cy="200" r="17"/>
      <circle cx="885" cy="245" r="17"/>
      <circle cx="840" cy="290" r="17"/><circle cx="930" cy="290" r="17"/>
    </g>
  </g>
</svg>
